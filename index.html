<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domina Tu Voz · Regalo · Voz Esencia™ Academy</title>
<meta name="description" content="Tu regalo de Mamselle Ruiz: el cuaderno Domina tu voz y gana confianza, en PDF.">
<meta name="theme-color" content="#0d4a5c">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

<!-- Meta Pixel: VEA dataset (Spanish) -->

n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;

<style>
/* Tokens from the gift PDF: cream, deep teal, aqua, serif italic title */
:root { --cream:#fffefa; --teal:#0d4a5c; --aqua:#6fbfb5; --btn:#E6B325; --btn-deep:#d3a015; --ink:#2b2b2b; --line:#e7e2d6; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  min-height: 100dvh; display: grid; place-items: center; padding: 16px;
  background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif;
}
main { width: 100%; max-width: 420px; text-align: center; }
.logo { height: 40px; width: auto; margin: 0 auto 14px; }
h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 2.1rem; line-height: 1.1; margin-bottom: 18px; }
h1 em { color: var(--aqua); font-style: italic; }
form { display: grid; gap: 10px; text-align: left; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; }
input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(111,191,181,0.25); }
button { margin-top: 6px; border: 0; cursor: pointer; background: var(--btn); color: #2f1525; font: inherit; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 12px; touch-action: manipulation; }
button:hover { background: var(--btn-deep); }
button:disabled { opacity: .7; cursor: wait; }
.err { color: #a3261e; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <img class="logo" src="Logo-es.png" alt="Voz Esencia™ Academy" width="174" height="40">
  <h1>Domina tu voz y gana <em>confianza</em></h1>
  <form id="lead-form">
    <div class="row">
      <div><label for="f-first">Nombre</label><input id="f-first" name="first_name" autocomplete="given-name" required></div>
      <div><label for="f-last">Apellido</label><input id="f-last" name="last_name" autocomplete="family-name" required></div>
    </div>
    <div><label for="f-email">Correo electrónico</label><input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" required></div>
    <div><label for="f-tel">Teléfono</label><input id="f-tel" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></div>
    <button id="submit" type="submit">Descargar mi cuaderno</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
</main>

<script>
/* Formspree "Lead magnet PDF" emails Charles + Mamselle (no Kit, by choice).
   On success the browser goes straight to the PDF. */
var FORMSPREE = 'https://formspree.io/f/mppqagwr';

document.getElementById('lead-form').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target, btn = document.getElementById('submit'), err = document.getElementById('err');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Enviando…';
  fetch(FORMSPREE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      first_name: f.first_name.value.trim(),
      last_name:  f.last_name.value.trim(),
      email:      f.email.value.trim(),
      phone:      f.phone.value.trim(),
      source:     'cadeau-pdf',
      _subject:   'Regalo PDF: nueva descarga'
    })
  }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    if(typeof fbq !== 'undefined') fbq('track', 'Lead', { content_name: 'cadeau-pdf' });
    setTimeout(function(){ location.href = 'cadeau.pdf'; }, 300);  /* let the pixel fire */
  }).catch(function(){
    err.textContent = 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.';
    err.hidden = false; btn.disabled = false; btn.textContent = 'Descargar mi cuaderno';
  });
});
</script>
</body>
</html>
